name: Build HarmonyOS (ohos)

# 本仓库是 kira 的鸿蒙移植版，CI 只构建鸿蒙 HAP，不再构建 Android / Windows。
#
# 触发方式：
#   1) 推送 v* tag：构建 release HAP 并创建/更新对应的 GitHub Release，
#      把 kira-<版本>-ohos-arm64.hap 作为 Release 资产上传（这就是"ohos 的
#      release 包"，应用内检查更新会从这里拿安装包）；
#   2) 手动 dispatch：同样构建，tag 输入留空时只上传 Actions artifact，
#      填了 tag 才创建 Release —— 便于先验证再正式发。
#
# 用的是 CPF-Flutter 的 oh-3.47.9-dev 分支，不是官方 Flutter。
# 本项目没有 Rust/FFI 原生核心、没有 libmpv，因此没有 Cargo 交叉编译步骤；
# HAP 里必需的原生库只有 libapp.so（AOT 载荷）、libflutter.so、libc++_shared.so。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号（如 v1.7.6）。留空则只产出 Actions artifact，不创建 Release"
        required: false
        default: ""
      note:
        description: "构建说明 (可选，写入 Release 正文与 Step Summary)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ohos-${{ github.ref }}
  cancel-in-progress: false

env:
  # 鸿蒙版 Flutter 分支；与本机开发环境保持一致（fqapp 用的是 oh-3.44.9-dev）。
  FLUTTER_OHOS_BRANCH: oh-3.47.9-dev
  # HarmonyOS 命令行工具版本（不是 SDK API 号）。26.0.0.821 自带 API 26 SDK，
  # 与本机开发环境的 SDK（ETS 包 26.0.0.105 / API 26）对应；
  # ohos/build-profile.json5 的 compatibleSdkVersion 仍声明 5.0.5(17)，
  # 二者不冲突：前者是编译所用工具链，后者是安装运行的最低兼容版本。
  OHOS_SDK_VERSION: "26.0.0.821"
  # 手动 dispatch 时用户填的版本号；tag 触发时为空，后续回落到 github.ref_name。
  INPUT_TAG: ${{ github.event.inputs.tag_name }}

jobs:
  build-hap:
    name: Build HAP (arm64)
    # 必须钉在 ubuntu-24.04，不能跟 ubuntu-latest 漂移：
    # HarmonyOS CLI 工具链自带的 ld.lld 依赖 libxml2.so.2，而 Ubuntu 25.10
    # 起把 libxml2 的 soname 换成了 libxml2.so.16；ubuntu-latest 已经指向
    # ubuntu-26.04，于是在 CMake 探测编译器时报
    #   ld.lld: error while loading shared libraries: libxml2.so.2
    # 整个 HAP 构建失败。24.04（noble）仍是 libxml2.so.2，可正常链接。
    # 升级镜像前需先确认 SDK 的 BiSheng 工具链已改用新的 soname。
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Linux deps for the HarmonyOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          # ErBWs/setup-ohos 的 README 明确要求 Linux 上有 libgl1-mesa-dev，
          # 否则 SDK 里的部分二进制工具在 runner 上无法加载。
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Install Flutter for OpenHarmony (${{ env.FLUTTER_OHOS_BRANCH }})
        shell: bash
        run: |
          set -euo pipefail
          # 必须完整 clone（不能 --depth 1）：ohos 版 flutter 靠 `git describe
          # --tags` 推导自身版本号，浅克隆会得到 0.0.0-unknown，随后的
          # `flutter pub get` 直接失败。
          git clone -b "$FLUTTER_OHOS_BRANCH" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics
          # doctor 只用于在日志里留证据；SDK 缺失由后面的真实构建暴露，
          # 不让 doctor 的退出码中断整个 job。
          flutter doctor -v || true

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          # 命令行工具版本；自带 API 26 SDK，与本机开发环境对齐。
          version: ${{ env.OHOS_SDK_VERSION }}
          cache: true

      - name: Verify toolchain environment
        shell: bash
        run: |
          set -euo pipefail
          # ErBWs/setup-ohos 会把这两个变量写进 $GITHUB_ENV；后续步骤
          # （hvigor 与 flutter build hap）都靠它们定位 SDK/NDK。这里显式打印
          # 出来便于排障：变量缺失只告警（构建随后会以更明确的错误失败），
          # 但一旦设置了就必须指向真实存在的目录。
          for var in HOS_SDK_HOME OHOS_NDK_HOME; do
            if [[ -z "${!var:-}" ]]; then
              echo "::warning::$var 未由 setup-ohos 导出，构建可能找不到 SDK/NDK" >&2
              continue
            fi
            echo "$var=${!var}"
            [[ -d "${!var}" ]] || { echo "::error::$var 指向的目录不存在: ${!var}" >&2; exit 1; }
          done

      - name: Get locked dependencies
        shell: bash
        env:
          # gitcode 上的 LFS 需要认证；跳过 smudge，只取源码。
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          set -euo pipefail
          # 不设置 PUB_HOSTED_URL：pubspec.lock 里的 hosted 依赖都钉在 pub.dev，
          # 指向镜像会让每个条目都对不上、--enforce-lockfile 直接失败。
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Build HAP (release, unsigned)
        shell: bash
        run: |
          set -euo pipefail
          # --no-codesign：CI 没有签名材料，让产物直接是 unsigned，
          # 避免 Hvigor 在签名阶段失败（失败时产物可能只写了一半）。
          # 实测本机产物在 build/ohos/hap/entry-default-unsigned.hap，
          # 同时 ohos/entry/build/default/outputs/default/ 下也有同名文件。
          flutter build hap --release --no-codesign --target-platform ohos-arm64 \
            2>&1 | tee /tmp/flutter_build_hap.log

      - name: Collect and validate unsigned HAP
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          # 文件名必须带 pubspec 的完整版本（含 +build）：lib/utils/app_update.dart
          # 的 _parseVersionFromName 用 /(\d+)\.(\d+)\.(\d+)\+(\d+)/ 解析内部版本，
          # 只写 1.7.6 会解析失败并退化成按时间排序，beta 渠道就无法比较新旧。
          pub_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ ! "$pub_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml 的 version 不是 <major>.<minor>.<patch>+<build> 形式: '$pub_version'" >&2
            exit 1
          fi
          echo "pub_version=$pub_version"

          # Release 版本号：手动 dispatch 用输入值，tag 触发用 tag 名。
          release_tag="${INPUT_TAG:-}"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "release_tag=$release_tag"

          # flutter build hap 会把产物复制到仓库根的 build/ohos/hap/，优先取那里；
          # 兜底再找 Hvigor 的原始输出目录。
          hap=""
          for candidate in \
            build/ohos/hap/entry-default-unsigned.hap \
            ohos/entry/build/default/outputs/default/entry-default-unsigned.hap; do
            if [[ -f "$candidate" ]]; then
              hap="$candidate"
              break
            fi
          done
          if [[ -z "$hap" ]]; then
            hap="$(find build/ohos/hap ohos/entry/build/default/outputs/default \
              -maxdepth 1 -name '*.hap' ! -name '*-signed.hap' 2>/dev/null | head -n1 || true)"
          fi
          if [[ -z "$hap" ]]; then
            echo "::error::flutter build hap --release --no-codesign 没有产出 unsigned .hap" >&2
            find build/ohos ohos/entry/build -name '*.hap' >&2 2>/dev/null || true
            exit 1
          fi
          case "$hap" in
            *.hap) ;;
            *) echo "::error::收集到的产物不是 .hap 文件: $hap" >&2; exit 1 ;;
          esac
          echo "hap_source=$hap"

          unzip -l "$hap" > /tmp/hap-listing.txt

          # release 构建的 AOT 载荷必须是 libs/arm64-v8a/libapp.so；
          # debug 包不含它，所以它缺失就是"构建模式不对"，而不是打包问题。
          payloads="$(grep -c 'libs/.*/libapp\.so' /tmp/hap-listing.txt || true)"
          if [[ "${payloads:-0}" -eq 0 ]]; then
            echo "::error::HAP 内没有 libapp.so（AOT 载荷），不是 release 构建" >&2
            grep 'libs/' /tmp/hap-listing.txt >&2 || true
            exit 1
          fi

          # libflutter.so 与 libc++_shared.so 是运行期必需（libapp.so 依赖
          # libc++_shared）；设备本身不提供，缺了会在启动时崩溃。
          missing=()
          for required in libapp.so libflutter.so libc++_shared.so; do
            if ! grep -q "libs/arm64-v8a/${required}\$" /tmp/hap-listing.txt; then
              missing+=("$required")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::HAP 缺少必需的原生库: ${missing[*]}" >&2
            grep 'libs/' /tmp/hap-listing.txt >&2 || true
            exit 1
          fi

          # 库文件存在也可能是 0 字节占位符；AOT 载荷至少有几百 KB。
          libapp_size="$(awk '$4 ~ /libs\/arm64-v8a\/libapp\.so$/ {print $1}' /tmp/hap-listing.txt | head -n1)"
          if [[ "${libapp_size:-0}" -lt 1048576 ]]; then
            echo "::error::HAP 内 libapp.so 只有 ${libapp_size:-0} 字节，AOT 载荷不完整" >&2
            exit 1
          fi

          # 资产名用 pubspec 完整版本（含 +build），与 app_update.dart 的
          # _parseVersionFromName 约定一致；+ 在 GitHub 资产名/URL 里合法。
          mkdir -p dist
          target="dist/kira-${pub_version}-ohos-arm64-unsigned.hap"
          install -m 0644 "$hap" "$target"
          ls -la dist/

          {
            echo "hap_path=$target"
            echo "hap_name=$(basename "$target")"
            echo "hap_size=$(stat -c %s "$target")"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### HarmonyOS HAP"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 产物 | \`$(basename "$target")\` |"
            echo "| 源路径 | \`$hap\` |"
            echo "| 大小 | $(stat -c %s "$target") 字节 |"
            echo "| AOT 载荷 | libapp.so / libflutter.so / libc++_shared.so 均在 |"
            echo "| 命令行工具 | $OHOS_SDK_VERSION（自带 API 26） |"
            echo "| Release | ${release_tag:-未创建（仅 artifact）} |"
            echo ""
            echo "该 HAP 由 CI 以 \`--no-codesign\` 构建，未签名；"
            echo "安装或分发前需用 DevEco Studio 完成签名。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${NOTE:-}" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "构建说明: ${NOTE}" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NOTE: ${{ github.event.inputs.note }}

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v6
        with:
          name: kira-ohos-hap
          path: dist/*.hap
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: steps.collect.outputs.release_tag != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -euo pipefail
          tag="${{ steps.collect.outputs.release_tag }}"
          hap="${{ steps.collect.outputs.hap_path }}"

          # 正文：版本号 + 该 tag 相对上一个 tag 的 feat/fix 标题（与旧 build-ci
          # 的日志风格一致），手动 dispatch 时补构建说明。
          {
            echo "Kira 鸿蒙版 ${tag}"
            echo
            prev="$(git tag --sort=-v:refname | grep -vx "$tag" | head -n1 || true)"
            if [[ -n "$prev" ]]; then
              git log --pretty=format:"%s" "${prev}..HEAD" \
                | grep -E '(^|[[:space:]])(feat|fix|style)[(:]' \
                | sed 's/^/- /' || true
            else
              git log --pretty=format:"%s" -30 \
                | grep -E '(^|[[:space:]])(feat|fix|style)[(:]' \
                | sed 's/^/- /' || true
            fi
            if [[ -n "${NOTE:-}" ]]; then
              echo
              echo
              echo "$NOTE"
            fi
            echo
            echo "> 鸿蒙 arm64 HAP，CI 以 --no-codesign 构建，安装前需自行签名。"
          } > release-notes.md

          if gh release view "$tag" --repo="$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 已存在的 Release：只替换同名 HAP 资产，不动正文与其它资产。
            gh release upload "$tag" "$hap" --repo="$GITHUB_REPOSITORY" --clobber
            echo "已更新 Release $tag 的 HAP 资产"
          else
            gh release create "$tag" "$hap" \
              --repo="$GITHUB_REPOSITORY" \
              --target="$GITHUB_SHA" \
              --title="Kira 鸿蒙版 ${tag}" \
              --notes-file release-notes.md \
              --latest
            echo "已创建 Release $tag"
          fi
