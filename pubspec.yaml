name: kira
description: "A comic reader app."
publish_to: "none"
version: 1.7.7+647
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.8.0+1
  charset: ^2.0.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # 鸿蒙适配：改用 OpenHarmony 社区分支（与 fqapp、PiliNara 同一个分支）。
  # 版本由 pubspec.lock 固定；升到 2.5.x(native 绑定变更)前必须真机验证冷启动
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  package_info_plus: ^10.1.0
  path: ^1.9.1
  # 鸿蒙适配：CPF-Flutter 分支，版本仍是 2.1.5。
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  # 鸿蒙适配：与 fqapp、PiliPlus 相同的 fork 与分支。
  url_launcher:
    git:
      url: https://gitcode.com/hellozeronick/url_launcher.git
      path: url_launcher
      ref: main
  flutter_svg: ^2.0.17
  flex_color_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flex_color_picker.git
      ref: dev
  scrollable_positioned_list: ^0.3.8
  crypto: ^3.0.7
  cryptography: ^2.9.0
  # 鸿蒙适配：fluttertpc 的鸿蒙分支，2.9.0 满足原约束 ^2.3.4。
  cryptography_flutter:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_cryptography_flutter.git
      ref: br_v2.9.0_ohos_dev
      path: cryptography_flutter
  xml: ^6.6.1
  archive: ^4.0.7
  screen_brightness: ^2.1.8
  # 鸿蒙适配：跟 PiliPlus 一样，宿主包固定在 1.3.3 并加装 wakelock_plus_ohos。
  wakelock_plus: 1.3.3
  wakelock_plus_ohos: ^0.0.3
  system_fonts: ^1.0.1
  flutter_displaymode:
    git:
      url: https://gitcode.com/oh-flutter/flutter_displaymode.git
      ref: master
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.1
  native_flutter_proxy: ^0.3.1
  go_router: ^17.3.0
  flutter_riverpod: ^3.0.0
  json_annotation: ^4.12.0
  material3_expressive_loading_indicator: ^0.1.2
  google_nav_bar: 5.0.7
  flutter_inappwebview:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos_dev
  # 鸿蒙适配：与 PiliPlus 同一个 fork；分支版本为 7.0.0，低于原约束 ^7.1.1 属预期。
  battery_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/battery_plus/battery_plus
      ref: br_battery_plus-v7.0.0_ohos
  connectivity_plus: ^7.3.0
  # 鸿蒙适配：与 fqapp 一致，宿主包继续用 hosted 版，另加只做原生注册的 ohos 包。
  connectivity_plus_ohos:
    git:
      url: https://github.com/HelloZeroNick/connectivity_plus_ohos.git
      ref: main
  gal: ^2.3.3
  share_plus: ^13.3.0
  flutter_confetti: ^0.9.2
  # 鸿蒙适配：参照 PiliPlus，改用本地 shim 包（packages/file_picker），
  # 内部只 re-export file_picker_ohos，使鸿蒙侧有平台实现。
  file_picker:
    path: packages/file_picker
  permission_handler: ^12.0.1
  # 鸿蒙适配：permission_handler 的鸿蒙实现（与 PiliPlus 同版本）。
  permission_handler_ohos: ^0.0.8
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  flutter_foreground_task:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_foreground_task.git
      ref: br_3.35_dev
  clock: ^1.1.1

dependency_overrides:
  # 鸿蒙适配：flutter_inappwebview 的 fork 依赖 hosted 的 platform_interface，
  # 该包没有 ohos 平台实现，按 PiliPlus 的做法一并指向鸿蒙分支。
  flutter_inappwebview_platform_interface:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview_platform_interface
      ref: br_v6.1.5_ohos_dev
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos_dev
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: br_3.41_dev
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: package_info_plus-9.0.0-ohos-1.0.0
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  share_plus: # 分享.鸿蒙适配
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
      ref: br_share_plus-v12.0.1_ohos
  material_ui:
    path: packages/material_ui
  cupertino_ui:
    path: packages/cupertino_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.8.0
  build_runner: ^2.4.0
  fake_async: ^1.3.2
  path_provider_platform_interface: ^2.1.2
  shared_preferences_platform_interface: ^2.4.2

flutter_launcher_icons:
  image_path: "assets/ic_launcher.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/ic_launcher.png
    - assets/ic_launcher_1.png
    - assets/github.svg
